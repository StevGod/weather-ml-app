name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check cluster is reachable
        run: kubectl get nodes

      - name: Apply Kubernetes manifests (yml deployment)
        run: kubectl apply -f k8s/

      - name: Rolling update to newest image
        run: kubectl rollout restart deployment/weather-ml-app

      - name: Wait for rolling update to finish
        run: kubectl rollout status deployment/weather-ml-app --timeout=300s

      - name: Show deployed pods and image
        run: |
          kubectl get pods -o wide
          echo "Deployed image:"
          kubectl get deployment weather-ml-app -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
